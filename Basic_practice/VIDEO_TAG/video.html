<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video</title>
</head>
<body>
    
    <H1>1. controls</H1>
    <video src="sports_car.mp4"  width="400" height="400" controls></video>

    <h1>2. autoplay</h1>
    <video src="sports_car.mp4" autoplay width="400" height="400"></video>
    
    <h1>3. loop</h1>
    <video src="sports_car.mp4" controls loop width="400" height="400"></video>

    <h1>4. muted</h1>
    <video src="sports_car.mp4" controls muted width="400" height="400"></video>

    <h1>5. poster</h1>
    <video src="sports_car.mp4" width="400" height="400" controls poster="https://th.bing.com/th/id/OIP.DGrfLPC8MZodIIuxL3tGngHaE7?w=334&h=182&c=7&r=0&o=7&dpr=1.4&pid=1.7&rm=3" video>

    <h1></h1>


</body>
</html>
