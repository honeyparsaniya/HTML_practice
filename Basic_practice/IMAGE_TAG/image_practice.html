<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image_tag</title>
</head>

<body>
    <!--this tag show img. from browser-->

    <img src="https://static1.hotcarsimages.com/wordpress/wp-content/uploads/2023/11/desktop_000-1.jpeg">
    <br><br>

    <!--this alt show when img. is not load-->
    <h1>add alternative text</h1>
    <p>if img not load alternativ text show</p>
    <img src="https://static1.hotcarsiges.com/wordpress/wp-content/uploads/2023/11/desktop_000-1.jpeg" alt="sport bike">
    <br><br>

    <!--set image width-->
    <h1>set width</h1>
    <img src="https://static1.hotcarsimages.com/wordpress/wp-content/uploads/2023/11/desktop_000-1.jpeg" width="900">
    <br><br>

    <!--set image hight-->
    <h1>set image hights</h1>
    <img src="https://static1.hotcarsimages.com/wordpress/wp-content/uploads/2023/11/desktop_000-1.jpeg" height="300">
    <br><br>

    <!--set title-->
    <h1>add title on image</h1>
    <img src="https://static1.hotcarsimages.com/wordpress/wp-content/uploads/2023/11/desktop_000-1.jpeg"
        title="Sport bike">
    <br><br>
    
</body>

</html>
